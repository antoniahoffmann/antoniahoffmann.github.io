<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description"
        content="Yoga mit Antonia – Element Yoga in Leipzig. Sanft, präzise und individuell.">
  <title>Yoga mit Antonia – Leipzig</title>
  <script src="main.ts" type="module"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"/>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#top" class="brand">
      <span class="brand-mark">A</span>
      <span class="brand-text">Yoga mit Antonia</span>
    </a>
    <nav class="site-nav" aria-label="Hauptnavigation">
      <a href="#kurse">Kurse</a>
      <a href="#methode">Methode</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-image">
        <img alt="Antonia Hoffmann" src="../assets/images/profile.jpg">
      </div>
      <div class="hero-text">
        <p class="eyebrow">Element Yoga · Leipzig</p>
        <div class="intro"></div>
        <a href="mailto:yoga-mit-antonia@posteo.de" class="btn-primary">Kontakt aufnehmen</a>
      </div>
    </div>
  </section>

  <section id="kurse" class="section section-muted">
    <div class="container narrow">
      <h2 class="section-title">Kurse</h2>
      <div class="divider"></div>
      <div class="kurse-content"></div>
    </div>
  </section>

  <section id="methode" class="section">
    <div class="container narrow">
      <div class="method"></div>
    </div>
  </section>

</main>

<footer id="kontakt" class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="brand-mark">A</span>
      <span>Yoga mit Antonia</span>
    </div>
    <p class="footer-contact">
      Für Anfragen schreibe mir gerne an
      <a href="mailto:yoga-mit-antonia@posteo.de">yoga-mit-antonia@posteo.de</a>
    </p>
    <button type="button" class="footer-link" data-open-impressum>Impressum</button>
    <p class="footer-meta">© <span class="year"></span> Antonia Hoffmann</p>
  </div>
</footer>

<dialog class="impressum-dialog" aria-labelledby="impressum-title">
  <div class="impressum-dialog-inner">
    <div class="impressum-dialog-head">
      <h3 id="impressum-title">Impressum</h3>
      <button type="button" class="impressum-close" aria-label="Schließen" data-close-impressum>&times;</button>
    </div>
    <div class="impressum-body"></div>
  </div>
</dialog>

</body>
</html>
